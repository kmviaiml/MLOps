# E-Commerce Sales Analytics & Churn Prediction System Configuration

project:
  name: "E-Commerce Sales Analytics & Churn Prediction"
  version: "1.0.0"
  author: "Data Engineering & MLOps Team"

paths:
  raw_online_retail: "online_retail.csv"
  raw_customer_churn: "ecommerce_customer_churn_large.csv"
  landing_dir: "data/raw"
  staging_dir: "data/staging"
  warehouse_db: "data/warehouse/ecommerce_dw.db"
  logs_dir: "data/logs"
  models_dir: "models"

etl:
  inactivity_window_days: 90
  min_quantity: 1
  min_unit_price: 0.001
  batch_size: 50000
  deduplicate: true
  currency: "GBP"

database:
  db_type: "sqlite"  # SQLite / PostgreSQL / DuckDB
  sqlite_path: "data/warehouse/ecommerce_dw.db"
  postgres_url: "postgresql://postgres:postgres@localhost:5432/ecommerce_dw"

ml:
  target_col: "churn"
  random_state: 42
  test_size: 0.2
  inactivity_threshold_days: 90
  models:
    logistic_regression:
      max_iter: 1000
      C: 1.0
    random_forest:
      n_estimators: 100
      max_depth: 10
    xgboost:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 6

monitoring:
  drift_psi_threshold: 0.2
  alert_email: "admin@ecommerce-mlops.com"
